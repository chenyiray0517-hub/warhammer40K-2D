<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Courier New',monospace; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#05060a; }
  #wrap:fullscreen { width:100vw; height:100vh; }
  #wrap:-webkit-full-screen { width:100vw; height:100vh; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; background:#000; display:block; touch-action:none; }

  .pad { position:absolute; pointer-events:auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
         font-weight:bold; color:rgba(255,255,255,.92); font-size:13px;

         box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 1px 2px rgba(255,255,255,.25);

  .pad:active { transform:scale(0.9); }
  /* left cluster: movement (bottom-left) */
  #dpad-left  { left:14px;  bottom:20px;  width:76px; height:76px; font-size:24px; background:rgba(70,110,190,.32); border:1.5px solid rgba(150,200,255,.55); }
  #dpad-right { left:106px; bottom:20px;  width:76px; height:76px; font-size:24px; background:rgba(70,110,190,.32); border:1.5px solid rgba(150,200,255,.55); }
  /* right cluster: action buttons (bottom-right, diamond layout) */

  #btn-fire   { right:118px; bottom:56px;  width:70px; height:70px; background:rgba(210,60,50,.36); border:1.5px solid rgba(255,150,140,.6); font-size:14px; }
  #btn-jump   { right:48px;  bottom:28px;  width:58px; height:58px; background:rgba(50,190,110,.34); border:1.5px solid rgba(150,255,180,.6); font-size:14px; }
  /* weapon swap: small, upper area of right cluster */
  #btn-swR    { right:122px; bottom:140px; width:46px; height:46px; background:rgba(180,120,40,.32); border:1.5px solid rgba(255,200,130,.55); font-size:11px; }
  #btn-swM    { right:190px; bottom:104px; width:46px; height:46px; background:rgba(180,120,40,.32); border:1.5px solid rgba(255,200,130,.55); font-size:11px; }
  #btn-dash   { right:44px;  bottom:182px; width:58px; height:58px; background:rgba(30,120,200,.36); border:1.5px solid rgba(100,200,255,.65); font-size:13px; }
  /* fullscreen button */
  #fsBtn { position:fixed; top:8px; right:12%; z-index:20; pointer-events:auto;
           padding:6px 10px; font-size:12px; color:#cfe; background:rgba(20,30,50,.6);
           border:1px solid rgba(120,160,220,.5); border-radius:6px; display:none;
           backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); font-family:'Courier New',monospace; }
  #pauseBtn { position:fixed; top:8px; left:12%; z-index:20; pointer-events:auto;
           width:34px; height:30px; font-size:13px; color:#fe9; background:rgba(20,30,50,.6);
           border:1px solid rgba(220,180,120,.5); border-radius:6px; display:none;
           backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); font-family:'Courier New',monospace; }
  #installBtn { position:fixed; top:8px; right:calc(12% + 84px); z-index:20; pointer-events:auto;
           padding:6px 10px; font-size:12px; color:#cfe; background:rgba(30,60,40,.7);
           border:1px solid rgba(120,220,150,.55); border-radius:6px; display:none;
           backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); font-family:'Courier New',monospace; }
  #hint { position:fixed; left:50%; bottom:6px; transform:translateX(-50%); color:#557; font-size:11px; z-index:5; text-align:center; }
  #updateBanner { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:50; display:flex; gap:8px; align-items:center;
    background:rgba(20,28,46,.96); color:#cfe; font:600 12px 'Courier New',monospace; padding:6px 8px 6px 12px;
    border:1px solid rgba(120,160,220,.6); border-radius:8px; box-shadow:0 3px 12px rgba(0,0,0,.5); }
  #updateBanner button { font:600 12px 'Courier New',monospace; color:#fff; background:#2f6fd0; border:none; border-radius:6px; padding:5px 10px; cursor:pointer; }
</style>

<script>
//============================================================
//  PWA SETUP — installable, fullscreen, offline-capable
//============================================================
(function(){
  // generate an app icon (space marine helmet on dark bg) as data URL
  function makeIcon(size){
    const cv=document.createElement('canvas'); cv.width=cv.height=size; const g=cv.getContext('2d');
    const s=size/48; // base 48px art scaled
    g.fillStyle='#0a0d18'; g.fillRect(0,0,size,size);
    // glow
    const rg=g.createRadialGradient(size/2,size/2,size*0.1,size/2,size/2,size*0.6);
    rg.addColorStop(0,'#162a55'); rg.addColorStop(1,'#0a0d18'); g.fillStyle=rg; g.fillRect(0,0,size,size);
    function r(x,y,w,h,c){ g.fillStyle=c; g.fillRect(x*s,y*s,w*s,h*s); }
    const blue='#2b4c9b',blueL='#4470d6',blueD='#16264f',trim='#e0bd4f';
    // helmet
    r(14,10,20,26,blue); r(14,10,20,5,blueL); r(14,30,20,6,blueD);
    r(20,6,8,6,trim); r(23,2,2,8,trim);               // top crest
    r(16,18,16,8,'#0e1530');                            // visor recess
    r(18,20,5,4,'#7fe0ff'); r(25,20,5,4,'#7fe0ff');     // eye lenses
    r(23,18,2,9,blueD);                                 // central ridge
    // aquila hint
    r(20,28,8,2,trim);
    return cv.toDataURL('image/png');
  }
  const icon192=makeIcon(192), icon512=makeIcon(512);
  // apple touch icon
  const al=document.createElement('link'); al.rel='apple-touch-icon'; al.href=icon192; document.head.appendChild(al);
  const fav=document.createElement('link'); fav.rel='icon'; fav.href=icon192; document.head.appendChild(fav);
  // manifest (inline blob)
  const manifest={ name:'Warhammer 40K — 為了帝皇', short_name:'為了帝皇',
    description:'橫向捲軸射擊遊戲 — 星際戰士對抗異形蟲族', start_url:'.', scope:'.',
    display:'fullscreen', display_override:['fullscreen','standalone'], orientation:'landscape',
    background_color:'#05060a', theme_color:'#05060a',
    icons:[ {src:icon192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
            {src:icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'} ] };
  const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  const ml=document.createElement('link'); ml.rel='manifest'; ml.href=URL.createObjectURL(mBlob); document.head.appendChild(ml);
  // service worker (./sw.js) — network-first 離線備援 + 自動更新提示（只清快取，不動 localStorage 分數）
  function showUpdateBanner(onUpdate){
    if(document.getElementById('updateBanner'))return;
    const b=document.createElement('div'); b.id='updateBanner';
    b.innerHTML='<span>🔄 有新版本</span><button id="updateGo">立即更新</button>';
    document.body.appendChild(b);
    document.getElementById('updateGo').addEventListener('click',()=>{ b.remove(); onUpdate(); });
  }
  function checkBuild(){ // 比對線上 index.html 的 build 版本，有新版就提示
    fetch('./index.html?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
      const m=t.match(/name="build" content="([^"]+)"/);
      const cur=(document.querySelector('meta[name=build]')||{}).content;
      if(m && cur && m[1]!==cur) showUpdateBanner(()=>location.reload());
    }).catch(()=>{});
  }
  if('serviceWorker' in navigator){
    let updateReady=false;
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(reg=>{
        reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw)return;
          nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller){ showUpdateBanner(()=>{ updateReady=true; nw.postMessage('skipWaiting'); }); } });
        });
        setInterval(()=>reg.update().catch(()=>{}), 120000);
      }).catch(()=>{});
      navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(updateReady)location.reload(); });
      checkBuild(); setInterval(checkBuild,120000);
    });
  } else { window.addEventListener('load',()=>{ checkBuild(); setInterval(checkBuild,120000); }); }
})();
</script>
<script>
//============================================================
//  WARHAMMER 40K — 為了帝皇  (original pixel tribute)
//============================================================
const CV=document.getElementById('c'), X=CV.getContext('2d');
const VW=480,VH=270; const SCALE=2; CV.width=VW*SCALE; CV.height=VH*SCALE; /* 2× 內部解析度；遊戲座標仍用 VW×VH */
let scale=1;
function resize(){ const r=Math.min(window.innerWidth/VW,window.innerHeight/VH);
  scale=r; CV.style.width=(VW*r)+'px'; CV.style.height=(VH*r)+'px'; }
window.addEventListener('resize',resize); resize();
const isMobile=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isMobile){ document.getElementById('touch').style.display='block'; document.getElementById('hint').style.display='none';
  document.getElementById('fsBtn').style.display='block'; }

// pause
let paused=false, quitConfirm=false;
const pauseBtn=document.getElementById('pauseBtn');
function togglePause(){
  if(state!=='PLAY'&&state!=='TRANS'&&state!=='CAMP'&&state!=='EXTRACT'){ return; }
  if(quitConfirm){ quitConfirm=false; return; } // ESC/P 取消確認框，維持暫停
  paused=!paused;
  pauseBtn.textContent=paused?'▶':'⏸';
  if(audioReady){ if(paused){ Tone.Transport.pause(); } else { Tone.Transport.start(); } }
  // release held inputs so player doesn't drift after resume
  if(paused){ keys.left=keys.right=keys.jump=keys.fire=keys.melee=false; }
}
pauseBtn.addEventListener('click',e=>{ e.stopPropagation(); togglePause(); });
pauseBtn.addEventListener('touchstart',e=>{ e.stopPropagation(); e.preventDefault(); togglePause(); },{passive:false});
function quitToTitle(){
  quitConfirm=false; paused=false; pauseBtn.textContent='⏸';
  keys.left=keys.right=keys.jump=keys.fire=keys.melee=keys.dash=false;
  stopMusic();
  bullets=[];ebullets=[];enemies=[];drops=[];particles=[];platforms=[];pools=[];shockwaves=[];
  boss=null;bossIntro=0;victoryParts=[];
  allies=[];alliesOY=[];frontlineAlliesSpawned=false;cmdMsgIdx=0;cmdMsgTime=0;
  state='TITLE';
}

// fullscreen + orientation lock
const fsBtn=document.getElementById('fsBtn');
function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement; }
function enterFs(){
  const el=document.getElementById('wrap');
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req){ try{ const p=req.call(el); if(p&&p.then){ p.then(afterFs).catch(()=>{ afterFs(); }); } else { afterFs(); } }catch(e){ afterFs(); } }
  else { afterFs(); } // iOS Safari: no element fullscreen API — just resize to fill
}
function exitFs(){ const ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen; if(ex){ try{ex.call(document);}catch(e){} } }
function afterFs(){ try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} setTimeout(resize,250); }
function toggleFs(){ if(!isFs()) enterFs(); else exitFs(); }
fsBtn.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); toggleFs(); });
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(ev=>
  document.addEventListener(ev,()=>{ fsBtn.textContent=isFs()?'⛶ 離開':'⛶ 全螢幕'; setTimeout(resize,250); }));

//------------------------ INPUT -----------------------------
const keys={left:false,right:false,jump:false,fire:false,melee:false,swR:false,swM:false,dash:false};
const kmap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'fire',KeyK:'melee',KeyU:'swR',KeyI:'swM',KeyY:'dash',KeyL:'lb',KeyQ:'quit',Enter:'start',KeyP:'pause',Escape:'pause'};
addEventListener('keydown',e=>{ const k=kmap[e.code]; if(k){ e.preventDefault();
  if(state==='TUTORIAL'){
    if(k==='left'){ if(tutPage>0){tutPage--;sfx('E5');} return; }
    if(k==='right'){ if(tutPage<TUT_PAGES_COUNT-1){tutPage++;sfx('E5');} return; }
    if(k==='pause'||k==='quit'){ state='SELECT'; sfx('E5'); return; }
    return;
  }
  if(state==='TERMINAL'){
    if(k==='left'){ selTerminalMission=(selTerminalMission-1+TERMINAL_MISSIONS.length)%TERMINAL_MISSIONS.length; sfx('E5'); return; }
    if(k==='right'){ selTerminalMission=(selTerminalMission+1)%TERMINAL_MISSIONS.length; sfx('E5'); return; }
    if(k==='start'){ if(!audioReady)initAudio().then(startGame);else startGame(); return; }
    if(k==='pause'||k==='quit'){ state='SELECT'; sfx('E5'); return; }
    return;
  }
  if(state==='LEADERBOARD'){ gotoTitle(); return; }
  if(k==='lb'){ if(state==='TITLE') gotoLeaderboard(); return; }
  if(k==='quit'){ if(paused){ if(quitConfirm) quitToTitle(); else quitConfirm=true; } return; }
  if(k==='start'){ if(state==='SELECT')confirmSelect(); else if(victoryWaitingNext){victoryWaitingNext=false;titleT=600;}else gotoSelect(); return;}
  if(k==='pause'){ togglePause(); return; }
  if(k==='swR'&&!keys.swR)cycleRanged();
  if(k==='swM'&&!keys.swM)cycleMelee();
  keys[k]=true; }});
addEventListener('keyup',e=>{ const k=kmap[e.code]; if(k)keys[k]=false; });
// 角色選擇畫面：←→ 切換軍團（Enter 出戰由上方 kmap 處理）
addEventListener('keydown',e=>{
  if(state!=='SELECT')return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){ selLegion=(selLegion+LEGIONS.length-1)%LEGIONS.length; sfx('E5'); }
  else if(e.code==='ArrowRight'||e.code==='KeyD'){ selLegion=(selLegion+1)%LEGIONS.length; sfx('E5'); }
  else if(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='Tab'||e.code==='KeyS'||e.code==='KeyW'){
    selMission=(selMission+1)%3; sfx('E5'); e.preventDefault(); }
});
function bindBtn(id,key,onPress){ const el=document.getElementById(id);
  const dn=e=>{e.preventDefault();keys[key]=true;if(onPress)onPress();};
  const up=e=>{e.preventDefault();keys[key]=false;};
  el.addEventListener('touchstart',dn,{passive:false}); el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('mousedown',dn); el.addEventListener('mouseup',up); el.addEventListener('mouseleave',up); }
bindBtn('dpad-left','left'); bindBtn('dpad-right','right');
bindBtn('btn-jump','jump'); bindBtn('btn-fire','fire'); bindBtn('btn-melee','melee');
bindBtn('btn-swR','swR',cycleRanged); bindBtn('btn-swM','swM',cycleMelee);
bindBtn('btn-dash','dash');
function titleAreaClick(pt){
  const rect=CV.getBoundingClientRect();
  const iy=(pt.clientY-rect.top)/rect.height*VH;
  if(iy>=208) gotoLeaderboard(); else gotoSelect();
}
function pauseAreaClick(pt){
  const rect=CV.getBoundingClientRect();
  const ix=(pt.clientX-rect.left)/rect.width*VW;
  const iy=(pt.clientY-rect.top)/rect.height*VH;
  if(!quitConfirm){
    // 點擊離開按鈕 → 進入確認
    if(iy>=VH/2+28 && iy<=VH/2+54) quitConfirm=true;
  } else {
    // 確認框：左半=確認離開，右半=取消
    if(iy>=VH/2+2 && iy<=VH/2+34){
      if(ix<VW/2) quitToTitle(); else quitConfirm=false;
    }
  }
}
CV.addEventListener('click',e=>{
  if(paused){ pauseAreaClick(e); return; }
  if(state==='TUTORIAL') tutorialClick(e);
  else if(state==='SELECT') selectClick(e);
  else if(state==='TERMINAL') terminalClick(e);
  else if(state==='LEADERBOARD') gotoTitle();
  else if(state==='TITLE') titleAreaClick(e);
  else if(state==='GAMEOVER'||state==='VICTORY'){ if(victoryWaitingNext){victoryWaitingNext=false;titleT=600;}else gotoSelect(); }
});
CV.addEventListener('touchstart',e=>{
  if(paused){e.preventDefault();pauseAreaClick(e.touches[0]);return;}
  if(state==='TUTORIAL'){e.preventDefault();tutorialClick(e.touches[0]);}
  else if(state==='SELECT'){e.preventDefault();selectClick(e.touches[0]);}
  else if(state==='TERMINAL'){e.preventDefault();terminalClick(e.touches[0]);}
  else if(state==='LEADERBOARD'){e.preventDefault();gotoTitle();}
  else if(state==='TITLE'){e.preventDefault();titleAreaClick(e.touches[0]);}
  else if(state==='GAMEOVER'||state==='VICTORY'){e.preventDefault();if(victoryWaitingNext){victoryWaitingNext=false;titleT=600;}else gotoSelect();}
});

//------------------------ AUDIO -----------------------------
let audioReady=false, musicMode='none';
let leadSynth,harmSynth,bassSynth,kickSynth,snareSynth,hatSynth,sfxSynth,hurtSynth;
let stageTracks=[],bossTrack,musicLoop,mStep=0;

const ROOTNOTE={E:'E2',C:'C2',G:'G2',D:'D2',A:'A2',B:'B2','F#':'F#2',F:'F2','C#':'C#2','G#':'G#2',Bb:'A#2'};
const FIFTH   ={E:'B2',C:'G2',G:'D3',D:'A3',A:'E3',B:'F#3','F#':'C#3',F:'C3','C#':'G#3','G#':'D#3',Bb:'F3'};
function upOct(n){ const m=n.match(/^([A-G]#?)(\d)$/); return m?m[1]+(parseInt(m[2])+1):n; }

// 8-bar songs (~12-14s loops) — one per stage + boss
const STAGE_SONGS=[
  // Stage 1 — 淪陷之城: driving E-minor heroic march
  { bpm:144, dk:false, bars:[
    {root:'E', lead:['E4',0,'B4',0,'E5',0,'B4',0]},
    {root:'E', lead:[0,'B4',0,'G4','E4',0,'B3',0]},
    {root:'C', lead:['C4',0,'G4',0,'C5',0,'G4',0]},
    {root:'C', lead:[0,'E4',0,'G4','C5',0,'G4',0]},
    {root:'G', lead:['G4',0,'D5',0,'G5',0,'D5',0]},
    {root:'G', lead:[0,'B4',0,'D5','G5',0,'D5',0]},
    {root:'D', lead:['D4',0,'A4',0,'D5',0,'A4',0]},
    {root:'B', lead:['B3',0,'F#4',0,'B4',0,'D5','F#5']} ]},
  // Stage 2 — 荒蕪戰壕: A-minor, heavier/martial, war drums feel
  { bpm:150, dk:true, bars:[
    {root:'A', lead:['A4',0,'A4',0,'C5',0,'E5',0]},
    {root:'A', lead:[0,'E4',0,'A4','C5',0,'A4',0]},
    {root:'F', lead:['F4',0,'C5',0,'F5',0,'C5',0]},
    {root:'F', lead:[0,'A4',0,'C5','F5',0,'C5',0]},
    {root:'G', lead:['G4',0,'D5',0,'G5',0,'D5',0]},
    {root:'G', lead:[0,'B4',0,'D5','G5',0,'B4',0]},
    {root:'E', lead:['E4',0,'B4',0,'E5',0,'G5',0]},
    {root:'E', lead:['E5','D5','C5','B4','A4',0,'E4',0]} ]},
  // Stage 3 — 瘟疫沼澤: D-minor, eerie/chromatic crawl
  { bpm:138, dk:false, bars:[
    {root:'D', lead:['D4',0,'F4',0,'A4',0,'F4',0]},
    {root:'D', lead:[0,'A4',0,'D5','C5',0,'A4',0]},
    {root:'Bb', lead:['A4',0,'C5',0,'D5',0,'C5',0]},
    {root:'A', lead:[0,'C5',0,'E5','A4',0,'G4',0]},
    {root:'F', lead:['F4',0,'A4',0,'C5',0,'A4',0]},
    {root:'G', lead:[0,'Bb4',0,'D5','G4',0,'F4',0]},
    {root:'D', lead:['D5',0,'C5','Bb4','A4',0,'F4',0]},
    {root:'A', lead:['A4',0,'D5',0,'F5','E5','D5',0]} ]},
  // Stage 4 — 暗影夜戰: C#-minor, tense stealthy pulse

function buildTrack(song){
  const steps=[]; const gallop=[1,0,1,1,0,0,1,1,1,0,1,1,0,0,1,0];
  song.bars.forEach(bar=>{
    for(let s=0;s<16;s++){
      const o={bass:null,lead:null,harm:null,kick:false,snare:false,hat:false};
      if(gallop[s]) o.bass=ROOTNOTE[bar.root];
      if(s%2===0){ const ln=bar.lead[s/2]; if(ln) o.lead=ln; }
      if(s===0) o.harm=[upOct(ROOTNOTE[bar.root]),upOct(FIFTH[bar.root])];
      if(s===0||s===8) o.kick=true;
      if(song.dk && (s===6||s===11||s===14)) o.kick=true;
      if(s===4||s===12) o.snare=true;
      if(s%2===0) o.hat=true;
      steps.push(o);
    }
  });
  return steps;
}

async function initAudio(){
  if(audioReady) return;
  await Tone.start();
  const master=new Tone.Compressor(-20,3).toDestination();
  const reverb=new Tone.Reverb(1.2); reverb.wet.value=0.15; reverb.connect(master);
  const dist=new Tone.Distortion(0.32).connect(reverb);
  leadSynth=new Tone.PolySynth(Tone.Synth,{maxPolyphony:8,oscillator:{type:'square'},
    envelope:{attack:0.005,decay:0.12,sustain:0.18,release:0.1},volume:-17}).connect(dist);
  harmSynth=new Tone.PolySynth(Tone.Synth,{maxPolyphony:8,oscillator:{type:'triangle'},
    envelope:{attack:0.02,decay:0.3,sustain:0.4,release:0.3},volume:-25}).connect(reverb);
  bassSynth=new Tone.MonoSynth({oscillator:{type:'sawtooth'},filter:{Q:1,type:'lowpass'},
    envelope:{attack:0.005,decay:0.12,sustain:0.5,release:0.08},
    filterEnvelope:{attack:0.005,decay:0.08,sustain:0.4,baseFrequency:160,octaves:2.2},volume:-11}).connect(dist);
  kickSynth=new Tone.MembraneSynth({pitchDecay:0.03,octaves:5,volume:-3}).connect(master);
  snareSynth=new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:0.001,decay:0.14,sustain:0},volume:-15}).connect(master);
  hatSynth=new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:0.001,decay:0.03,sustain:0},volume:-28}).connect(master);
  sfxSynth=new Tone.Synth({oscillator:{type:'square'},envelope:{attack:0.001,decay:0.08,sustain:0,release:0.05},volume:-15}).connect(reverb);
  // dedicated hurt sound: low detuned thud + noise
  hurtSynth=new Tone.MembraneSynth({pitchDecay:0.08,octaves:3,oscillator:{type:'sine'},envelope:{attack:0.001,decay:0.25,sustain:0,release:0.1},volume:-2}).connect(master);

  stageTracks=STAGE_SONGS.map(buildTrack);
  bossTrack=buildTrack(BOSS_SONG); menuTrack=buildMenuTrack();
  musicLoop=new Tone.Loop(time=>{
    let track; if(musicMode==='boss')track=bossTrack; else if(musicMode==='stage')track=stageTracks[Math.min(level,4)]||stageTracks[0]; else if(musicMode==='menu')track=menuTrack; else return;
    if(!track)return;
    const st=track[mStep%track.length];
    try{
      if(st.bass) bassSynth.triggerAttackRelease(st.bass,'16n',time);
      if(st.lead) leadSynth.triggerAttackRelease(st.lead,'16n',time);
      if(st.harm) harmSynth.triggerAttackRelease(st.harm,'2n',time);
      if(st.kick) kickSynth.triggerAttackRelease('C1','8n',time);
      if(st.snare) snareSynth.triggerAttackRelease('16n',time);
      if(st.hat) hatSynth.triggerAttackRelease('32n',time);
    }catch(e){}
    mStep++;
  },'16n');
  audioReady=true;
}

function setMusic(mode){
  if(!audioReady)return; if(musicMode===mode && mode!=='stage')return;
  const fresh=(musicMode==='none');
  musicMode=mode; mStep=0;
  Tone.Transport.bpm.value=(mode==='menu')?MENU_SONG.bpm:(mode==='boss')?BOSS_SONG.bpm:(STAGE_SONGS[level]||STAGE_SONGS[0]).bpm;
  if(musicLoop && fresh){ musicLoop.start(0); }
  if(Tone.Transport.state!=='started') Tone.Transport.start();
}

// 死亡音效：~2 秒下行哀號 + 低音下沉 + 終結重擊延音（直接用 Tone.now()，不靠 Transport）
function deathSfx(){ if(!audioReady)return; try{
  const t=Tone.now();
  // 下行主旋律（D 小調，逐音放慢）
  leadSynth.triggerAttackRelease('A3',0.30,t+0.00);
  leadSynth.triggerAttackRelease('G3',0.30,t+0.35);
  leadSynth.triggerAttackRelease('F3',0.34,t+0.70);
  leadSynth.triggerAttackRelease('D3',0.60,t+1.05);
  // 低音同步下沉
  bassSynth.triggerAttackRelease('A1',0.5,t+0.00);
  bassSynth.triggerAttackRelease('F1',0.5,t+0.55);
  bassSynth.triggerAttackRelease('D1',0.9,t+1.10);
  // 終結：重擊 + D 小調延音收尾（~2 秒處）
  kickSynth.triggerAttackRelease('C1','4n',t+1.55);
  hurtSynth.triggerAttackRelease('A1','2n',t+1.55);
  harmSynth.triggerAttackRelease(['D3','F3','A3'],0.9,t+1.60);
}catch(_){}}

function fireRanged(){
  const w=RANGED[player.rw],lvl=player.rlvl[player.rw];
  if(player.fireCD>0)return;
  if(player.rw===3){ // grenade: special rate table + lobbed projectile
    player.fireCD=GRENADE_RATE[lvl-1]||16;
    const dmg=w.dmg*(1+(lvl-1)*0.35)*(player.blessing>0?2:1)*player.dmgMult;
    const blast=w.blast*(1+(lvl-1)*0.15);
    const ox=player.x+player.w/2+player.face*18, oy=player.y+12;
    bullets.push({x:ox,y:oy,vx:player.face*w.speed,vy:-4.2,grav:0.16,dmg:dmg,sz:w.sz,color:w.color,pierce:false,life:96,kind:3,blast:blast});
    sfx(w.snd,'16n');
    for(let i=0;i<3;i++)particles.push({x:ox,y:oy,vx:player.face*1.5+Math.random(),vy:-Math.random()*2,life:8,c:w.color});
    return;
  }
  player.fireCD=Math.max(4,w.rate-(lvl-1)*2);
  const dmg=w.dmg*(1+(lvl-1)*0.35)*(player.blessing>0?2:1)*player.dmgMult;
  const cnt=(player.rw===1)?1+lvl:w.cnt+(lvl>=3?1:0);
  const ox=player.x+player.w/2+player.face*22, oy=player.y+17;
  for(let i=0;i<cnt;i++){
    const sp=(w.spread||0)*(Math.random()-.5)*2+(player.rw===1?(Math.random()-.5)*0.4:0);
    bullets.push({x:ox,y:oy,vx:player.face*w.speed,vy:sp*w.speed,dmg:dmg,sz:w.sz,color:w.color,pierce:w.pierce,life:w.life||80,kind:player.rw});
  }
  sfx(w.snd,player.rw===2?'8n':'32n');
  for(let i=0;i<3;i++)particles.push({x:ox,y:oy,vx:player.face*2+Math.random(),vy:(Math.random()-.5)*2,life:8,c:w.color});
}
function grenadeExplode(b){
  const r=b.blast||46;
  for(let i=0;i<22;i++){ const a=Math.random()*6.28, sp=Math.random()*5; particles.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:18+Math.random()*10,c:i%3?'#ffb347':'#ff5a1a'}); }

  enemies.forEach(e=>{ if(e.dead)return; const cx=e.x+e.w/2,cy=e.y+e.h/2; if(Math.hypot(cx-b.x,cy-b.y)<r+e.w/2) damageEnemy(e,b.dmg); });
  if(boss&&!bossIntro){ const cx=boss.x+boss.w/2,cy=boss.y+boss.h/2; if(Math.hypot(cx-b.x,cy-b.y)<r+boss.w/2) damageBoss(b.dmg); }
  sfx('C2','8n');
}

function damageEnemy(e,dmg){ e.hp-=dmg; e.hitFlash=6;

    case 'energy': player.energy=Math.min(100,player.energy+40); checkUpgrade(); flashMsg('+能量'); sfx('G5'); break;
    case 'shield': player.shield=Math.min(player.maxShield,player.shield+40); flashMsg('+護盾'); sfx('A5'); break;
    case 'wchip':{ const wi=Math.floor(Math.random()*RANGED.length); if(player.rlvl[wi]<5){player.rlvl[wi]++;flashMsg('武器晶片! '+RANGED[wi].name.split(' ')[0]+' LV'+player.rlvl[wi]);}else{const mi=Math.floor(Math.random()*3);player.mlvl[mi]++;flashMsg('武器晶片! 近戰升級');} sfx('C6','8n'); break; }
    case 'ammo': player.blessing=Math.max(player.blessing,180); flashMsg('彈藥強化!'); sfx('D6'); break;
    case 'blessing': player.blessing=300; player.inv=Math.max(player.inv,300); player.hp=Math.min(player.maxhp,player.hp+40); flashMsg('★ 帝皇恩賜 ★ 無敵+雙倍火力!'); sfx('C6','4n'); break;
  } score+=50; }
function aabb(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function hurtPlayer(dmg){ if(player.inv>0||player.blessing>0)return;
  if(player.shield>0){ const a=Math.min(player.shield,dmg); player.shield-=a; dmg-=a; }
  player.hp-=dmg; player.inv=50; hurtSfx();
  for(let i=0;i<8;i++)particles.push({x:player.x+13,y:player.y+22,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:14,c:'#f44'});
  if(player.hp<=0){ player.hp=0; gameOver(); } }
function gameOver(){ state='GAMEOVER'; stopMusic(); deathSfx(); recordScore(false); }

//------------------------ UPDATE ----------------------------
function update(){
  if(paused)return;
  if(state==='CAMP'){updateCamp();return;}
  if(state==='EXTRACT'){updateExtract();return;}
  if(state!=='PLAY'&&state!=='TRANS')return;
  const len=LV_LEN[level];
  if(state==='TRANS'){ transTimer--;
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;}); particles=particles.filter(p=>p.life>0);
    drops.forEach(d=>{d.t++;d.y+=d.vy;d.vy+=0.18;if(d.y>GROUND-12){d.y=GROUND-12;d.vy=0;}});
    if(transTimer<=0){ level++; if(level>=5){ recordScore(true); titleT=0; victoryParts=[]; state='VICTORY'; stopMusic(); return; } state='PLAY'; musicMode='none'; buildLevel(); }
    return;
  }
  if(player.fireCD>0)player.fireCD--; if(player.meleeCD>0)player.meleeCD--;
  if(player.meleeAnim>0)player.meleeAnim--; if(player.inv>0)player.inv--;
  if(player.blessing>0)player.blessing--; if(msgTime>0)msgTime--; if(stageBanner>0)stageBanner--; levelTimer++;
  if(player.dashCD>0)player.dashCD--;

  // 衝刺觸發（Y鍵；按跳躍同時按Y = 往上衝刺）
  if(keys.dash && player.dashCD<=0){
    const isUp=keys.jump; // 同時按跳躍 = 上衝
    const hdir=keys.left?-1:keys.right?1:0;
    const effectiveH=hdir!==0?hdir:(isUp?0:player.face); // 純上衝時可無水平分量
    if(!isUp||hdir!==0) player.face=effectiveH||player.face;
    player.dashCD=player.dashCDMax; player.dashTimer=isUp?10:12;
    player.dashVx=effectiveH*(isUp?7:12);
    player.dashVy=isUp?-11:0;
    player.vx=player.dashVx; player.vy=player.dashVy;
    if(isUp) player.onGround=false;
    player.inv=Math.max(player.inv,20);
    player.dashHits=new Set();
    player.fireCD=Math.max(player.fireCD,player.dashTimer+8); // 強制中斷射擊
    // 血天使：上衝後開啟天罰俯衝
    if(isUp && selLegion===1){ player.diveReady=true; player.diveHits=new Set(); }
    sfx('G5','32n');
    const pcx=player.x+player.w/2, pcy=player.y+(isUp?player.h:22);
    for(let i=0;i<12;i++) particles.push({x:pcx+(Math.random()-.5)*10,y:pcy+Math.random()*14,
      vx:-effectiveH*4+(Math.random()-.5)*3, vy:isUp?2+Math.random()*2:(Math.random()-.5)*3,
      life:15, c:isUp?'#ffd24a':i%2?'#5ad6ff':'#fff'});
  }
  // 衝刺中：鎖定速度 + 殘影粒子
  if(player.dashTimer>0){
    player.dashTimer--;
    player.vx=player.dashVx;
    if(player.dashVy<0) player.vy=player.dashVy; // 上衝：對抗重力鎖定速度
    player.dashTrail.unshift({x:player.x,y:player.y,life:10,maxLife:10,isUp:player.dashVy<0});
    if(player.dashTrail.length>6) player.dashTrail.pop();
    if(player.dashTimer%2===0){
      const isUp=player.dashVy<0;
      const tx=player.dashVx>0?player.x:player.x+player.w;
      for(let i=0;i<3;i++) particles.push({
        x:isUp?player.x+player.w/2+(Math.random()-.5)*8:tx+(Math.random()-.5)*4,
        y:isUp?player.y+player.h-2+Math.random()*6:player.y+12+Math.random()*24,
        vx:-player.dashVx*0.15+(Math.random()-.5)*0.8,
        vy:isUp?2+Math.random()*2:(Math.random()-.5)*1.2,
        life:9, c:isUp?'#ffd24a':'#5ad6ff'});
    }
  }
  player.dashTrail.forEach(t=>t.life--);
  player.dashTrail=player.dashTrail.filter(t=>t.life>0);

  const accel=0.62,maxv=2.7;
  if(player.dashTimer<=0){
    if(keys.left){player.vx-=accel;player.face=-1;}
    if(keys.right){player.vx+=accel;player.face=1;}
    if(!keys.left&&!keys.right)player.vx*=0.7;
    player.vx=Math.max(-maxv,Math.min(maxv,player.vx));
  }
  if(Math.abs(player.vx)>0.3&&player.onGround)player.walk+=0.3; else player.walk*=0.6;
  if(keys.jump&&player.onGround&&player.dashTimer<=0){ player.vy=-7.4; player.onGround=false; sfx('C5','32n'); }
  player.vy+=0.42; if(player.vy>9)player.vy=9;
  player.x+=player.vx; player.y+=player.vy;
  if(player.x<camX+2)player.x=camX+2; if(player.x>len-40)player.x=len-40;

  player.onGround=false;
  if(player.y+player.h>=GROUND){ player.y=GROUND-player.h; player.vy=0; player.onGround=true; }
  platforms.forEach(p=>{ if(player.vy>=0&&player.x+player.w>p.x+3&&player.x<p.x+p.w-3){
      const prevBottom=player.y+player.h-player.vy;
      if(prevBottom<=p.y+6&&player.y+player.h>=p.y&&player.y+player.h<=p.y+20){ player.y=p.y-player.h; player.vy=0; player.onGround=true; } } });
  if(player.diving&&player.onGround){ player.diving=false; diveImpact(); }
  if(player.onGround) player.diveReady=false;

  if(player.dashTimer<=0){
    if(player.rw===4){
      if(keys.fire){ if(player.chargeTimer<120)player.chargeTimer++; }
      else if(player.chargeTimer>0){
        if(player.chargeTimer>=120) fireChargedShot(); else fireRanged();
        player.chargeTimer=0;
      }
    } else { player.chargeTimer=0; if(keys.fire)fireRanged(); }
  }
  if(keys.melee){ if(selLegion===1&&player.diveReady&&!player.onGround&&!player.diving) startDive(); else doMelee(); }

  // side-scroller: camera only advances right, never scrolls back
  const _defActive=isSpecialLevel&&relayTower&&relayTower.active&&!relayTower.done;
  if(_defActive){
    // 塔防進行中：鎖定捲軸，限制玩家不超出右邊界
    if(player.x>camX+VW-16)player.x=camX+VW-16;
  } else {
    const desiredCam=Math.min(len-VW,player.x-VW*0.35);
    if(desiredCam>camX) camX+=(desiredCam-camX)*0.12;
    if(camX<0)camX=0;
  }

  if(!isSpecialLevel&&!boss&&player.x>len-VW-40&&!window._bossSpawned){ spawnBoss(); window._bossSpawned=true; }
  // 特殊任務：觸發塔防 / 塔防完成後生 boss
  if(isSpecialLevel){
    if(!relayTower && player.x>SPECIAL_DEFENSE_X){
      relayTower={x:player.x+90,y:GROUND,hp:player.maxhp*10,maxhp:player.maxhp*10,
                  timer:SPECIAL_DEFENSE_DUR,active:true,done:false};
      specialWaveCD=18; specialWaveCount=0; specialEnemiesKilled=0;
      flashMsg('電磁塔已設置！守護30秒！100隻敵人來襲！'); sfx('C5','4n');
    }
    if(relayTower&&relayTower.active&&!relayTower.done){
      relayTower.timer--;
      if(relayTower.hp<=0){ relayTower.hp=0; gameOver(); return; }
      // 成功條件：30秒守護完成
      if(relayTower.timer<=0){ relayTower.done=true; flashMsg('守護成功！繼續前進！'); sfx('C6','4n'); }
      // 波次生怪（從鏡頭右側），共100隻，每18幀一隻，隨機種類（無魔王）
      specialWaveCD--;
      if(specialWaveCD<=0 && specialWaveCount<100){
        specialWaveCD=18; specialWaveCount++;
        const tbl=['crawler','upright','infected','spitter','flyer','brute'];
        const wt=[0.22,0.26,0.14,0.18,0.12,0.08]; let rr=Math.random(),tp='upright',acc=0;
        for(let i=0;i<tbl.length;i++){acc+=wt[i];if(rr<acc){tp=tbl[i];break;}}
        spawnEnemy(tp, camX+50+Math.random()*(VW-100), GROUND);
        enemies[enemies.length-1].waveEnemy=true; // 標記為防守波次敵人
      }
      // 敵人碰塔傷害
      enemies.forEach(e=>{
        if(!e.dead){ if(e.towerCD>0)e.towerCD--; else if(Math.hypot(e.x+e.w/2-relayTower.x,e.y+e.h/2-(GROUND-55))<38){
          relayTower.hp-=e.dmg*0.35; e.towerCD=36;
          for(let k=0;k<4;k++) particles.push({x:relayTower.x+(Math.random()-.5)*10,y:GROUND-55+(Math.random()-.5)*8,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:12,c:'#5ad6ff'});
        }}
      });
    }
    // Boss 生成：守護完成後，走到關卡尾端才觸發（距離判定，和普通關卡一致）
    if(relayTower&&relayTower.done&&!boss&&player.x>LV_LEN[5]-VW-40&&!window._bossSpawned){ spawnBoss(); window._bossSpawned=true; }
  }

  bullets.forEach(b=>{ b.x+=b.vx; if(b.grav)b.vy+=b.grav; b.y+=b.vy; b.life--;
    if(b.kind===3){ // grenade: explode on enemy/boss/ground/life-end
      let hit=false;
      for(const e of enemies){ if(!e.dead&&aabb({x:b.x-b.sz/2,y:b.y-b.sz/2,w:b.sz,h:b.sz},e)){ hit=true; break; } }
      if(boss&&!bossIntro&&aabb({x:b.x-b.sz/2,y:b.y-b.sz/2,w:b.sz,h:b.sz},boss)) hit=true;
      if(b.y+b.sz/2>=GROUND){ b.y=GROUND-b.sz/2; hit=true; }
      if(hit||b.life<=0){ grenadeExplode(b); b.life=0; }
      return;
    }
    if(b.kind===4){
      if(!b.hits)b.hits=new Set();
      const bx4={x:b.x-b.pw/2,y:b.y,w:b.pw,h:b.ph};
      enemies.forEach(e=>{if(!e.dead&&!b.hits.has(e)&&aabb(bx4,e)){b.hits.add(e);damageEnemy(e,b.dmg);for(let k=0;k<8;k++)particles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:18,c:'#a0e4ff'});}});
      if(boss&&!bossIntro&&!b.hits.has(boss)&&aabb(bx4,boss)){b.hits.add(boss);damageBoss(b.dmg);}
      return;
    }
    enemies.forEach(e=>{ if(!e.dead&&aabb({x:b.x-b.sz/2,y:b.y-b.sz/2,w:b.sz,h:b.sz},e)){ damageEnemy(e,b.dmg); if(!b.pierce)b.life=0;
      for(let i=0;i<3;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:8,c:b.color}); }});
    if(boss&&!bossIntro&&aabb({x:b.x-b.sz/2,y:b.y-b.sz/2,w:b.sz,h:b.sz},boss)){ damageBoss(b.dmg); if(!b.pierce)b.life=0; } });
  bullets=bullets.filter(b=>b.life>0&&b.x>camX-40&&b.x<camX+VW+40);

  ebullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; if(b.grav)b.vy+=b.grav; b.life--;
    if(b.acidBomb&&b.y+3>=GROUND){ pools.push({x:b.x,y:GROUND-4,r:28,life:300,dmg:0.65,c:'#7da010'});
      for(let k=0;k<8;k++) particles.push({x:b.x,y:GROUND-4,vx:(Math.random()-.5)*5,vy:-Math.random()*4,life:16,c:'#9fa'}); b.life=0; return; }
    if(aabb({x:b.x-3,y:b.y-3,w:6,h:6},player)){ hurtPlayer(b.dmg); b.life=0; } });
  ebullets=ebullets.filter(b=>b.life>0&&b.y<VH+20);

  // poison / hazard pools
  pools.forEach(po=>{ po.life--; if(aabb({x:po.x-po.r,y:po.y-4,w:po.r*2,h:8},player)) hurtPlayer(po.dmg); });
  pools=pools.filter(po=>po.life>0);

  enemies.forEach(e=>{ if(e.dead)return; e.t+=0.06; if(e.hitFlash>0)e.hitFlash--; if(e.stomp>0)e.stomp--;
    if(e.x>camX-40&&e.x<camX+VW+40){
      const dir=Math.sign(player.x-e.x)||1;
      if(e.type==='spitter'){ e.shootCD--; if(e.shootCD<=0){ e.shootCD=80+Math.random()*40;
          const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
          ebullets.push({x:e.x+e.w/2,y:e.y+8,vx:dx/d*2.4,vy:dy/d*2.4,dmg:e.dmg,life:160,c:'#9f4'}); sfx('F3','16n'); }
        e.x+=Math.sin(e.t)*0.4;
      } else if(e.type==='brute'){
        // slow advance + heavy lobbed shots + occasional stomp shockwave
        e.x+=dir*e.spd; e.shootCD--;
        if(e.shootCD<=0){ e.shootCD=110+Math.random()*70;
          if(Math.abs(player.x-e.x)<70){ e.stomp=24; // close: stomp shockwave
            for(let i=-2;i<=2;i++) ebullets.push({x:e.x+e.w/2,y:GROUND-4,vx:i*2.2,vy:-1.2,grav:0.07,dmg:28,life:130,c:'#c96'});
            sfx('E2','8n');
          } else { // far: lob 2 heavy globs
            for(let i=0;i<2;i++) ebullets.push({x:e.x+e.w/2,y:e.y+10,vx:dir*(1.6+i*0.6),vy:-2.4,grav:0.08,dmg:30,life:200,c:'#fb6'});
            sfx('D3','8n'); } }
      } else if(e.type==='flyer'){
        // winged bug: advances toward player while bobbing up/down; occasional swoop dive
        e.wing+=0.4;
        e.x+=dir*e.spd;
        if(e.swoop>0){ e.swoop--; const tgt=player.y+8; e.y+=(tgt-e.y)*0.06; } // dive toward player height
        else { e.y=e.flyBase+Math.sin(e.t*e.bobSp*20+e.wing*0.3)*e.bobAmp; }
        e.shootCD--;
        if(e.shootCD<=0){ e.shootCD=90+Math.random()*70;
          if(Math.random()<0.4){ e.swoop=40; }
          else { const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
            ebullets.push({x:e.x+e.w/2,y:e.y+e.h,vx:dx/d*2.6,vy:dy/d*2.6,dmg:e.dmg,life:150,c:'#d6f'}); sfx('A3','16n'); } }
      } else { e.x+=dir*e.spd*(e.type==='infected'?(0.8+0.3*Math.sin(e.t)):1);
        if(e.type==='crawler')e.y=GROUND-e.h-Math.abs(Math.sin(e.t*3))*3; }
    } });
  enemies.forEach(e=>{ if(!e.dead&&e.touch&&aabb(player,e))hurtPlayer(e.dmg*0.5); });
  // 衝刺傷害（任意方向，每個敵人只被打一次）
  if(player.dashTimer>0 && player.dashHits){
    enemies.forEach(e=>{ if(!e.dead&&!player.dashHits.has(e)&&aabb(player,e)){
      const dd=Math.round(120*player.dashDmgMult);
      player.dashHits.add(e); damageEnemy(e,dd);
      for(let k=0;k<8;k++) particles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-.5)*6,vy:-2-Math.random()*3,life:16,c:player.dashVy<0?'#ffd24a':'#5ad6ff'});
    }});
    if(boss&&!bossIntro&&!player.dashHits.has(boss)&&aabb(player,boss)){ player.dashHits.add(boss); damageBoss(Math.round(120*player.dashDmgMult)); }
  }
  // 血天使天罰俯衝：飛行殘影
  if(player.diving&&!player.onGround)
    for(let i=0;i<3;i++) particles.push({x:player.x+Math.random()*26,y:player.y+Math.random()*44,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:10,c:i%2?'#e23a3a':'#ff8040'});
  enemies=enemies.filter(e=>!e.dead);
  if(isSpecialLevel&&ally) updateAlly();
  if(isTerminalMission&&allies.length>0) updateAlliesGroup();
  // 前線救援：抵達中點時觸發友軍加入
  if(isTerminalMission&&level===7&&!frontlineAlliesSpawned&&player.x>=4200) spawnFrontlineAllies();
  // 前線救援：友軍加入後持續生怪（從鏡頭右側湧入）
  if(isTerminalMission&&level===7&&frontlineAlliesSpawned&&!boss){
    if(--frontlineWaveCD<=0){
      frontlineWaveCD=20;
      const tbl=['crawler','upright','infected','spitter','flyer','brute'];
      const wt=[0.22,0.28,0.14,0.18,0.12,0.06]; let rr=Math.random(),tp='upright',acc=0;
      for(let i=0;i<tbl.length;i++){acc+=wt[i];if(rr<acc){tp=tbl[i];break;}}
      spawnEnemy(tp, camX+VW+20+Math.random()*60, GROUND);
    }
  }
  // 長官通訊：依里程碑推進
  if(isTerminalMission&&!boss){const cmds=TERMINAL_CMD[selTerminalMission];if(cmds&&cmdMsgIdx<cmds.length&&player.x>=cmds[cmdMsgIdx].x){flashCmd(cmds[cmdMsgIdx].t);cmdMsgIdx++;}}
  if(cmdMsgTime>0)cmdMsgTime--;

  if(boss){ if(bossIntro>0)bossIntro--; else{
      boss.t+=0.04; if(boss.hitFlash>0)boss.hitFlash--; if(boss.tele>0)boss.tele--; if(boss.charge>0)boss.charge--;
      const hpr=boss.hp/boss.maxhp; const enraged=hpr<0.4;
      if(boss.ultWind<=0) boss.shootCD--;
      const px0=player.x, py0=player.y;
      const dx=px0-boss.x, dy=py0-boss.y;

      if(boss.level===0){
        // 噬肉巢母: hovers, periodically SPAWNS small crawlers + spits arc of eggs
        const tx=Math.max(camX+VW-100,px0+120); boss.x+=Math.sign(tx-boss.x)*0.5;
        boss.y=boss.baseY+Math.sin(boss.t*2)*16;
        if(boss.shootCD<=0){ boss.shootCD=enraged?70:100;
          // spawn 1-2 crawlers from the maw
          const n=enraged?2:1;
          for(let i=0;i<n;i++){ if(enemies.length<40){ const e={x:boss.x+20,y:boss.y+boss.h-10,vx:0,vy:0,type:'crawler',hitFlash:0,t:0,dead:false,w:30,h:18,hp:21,dmg:12,spd:0.9,touch:true}; enemies.push(e);
            for(let k=0;k<6;k++)particles.push({x:e.x+15,y:e.y+9,vx:(Math.random()-.5)*4,vy:-Math.random()*3,life:14,c:'#b14d8e'}); } }
          sfx('A3','8n');
          // spit 3 lobbed eggs
          for(let i=0;i<3;i++) ebullets.push({x:boss.x+boss.w/2,y:boss.y+20,vx:-1.4-i*0.5,vy:-2.2-Math.random(),grav:0.08,dmg:16,life:200,c:'#d97'});
        }
      } else if(boss.level===1){
        // 裂顎屠夫: telegraphs then DASHES across, melee bruiser
        boss.y=boss.baseY+8;
        if(boss.charge>0){ boss.x+=boss.dashV; if(boss.x<camX+30){boss.x=camX+30;boss.dashV*=-1;} if(boss.x>camX+VW-boss.w-20){boss.x=camX+VW-boss.w-20;boss.dashV*=-1;} }
        else { const tx=Math.max(camX+VW-110,px0+90); boss.x+=Math.sign(tx-boss.x)*0.6;
          if(boss.shootCD<=0){ boss.shootCD=enraged?80:120; boss.tele=30; } }
        if(boss.tele>0 && boss.tele===1){ boss.charge=enraged?70:55; boss.dashV=Math.sign(dx)*5.5||-5.5; sfx('E2','8n'); }
        // occasional shockwave
        if(boss.shootCD===40){ for(let i=-2;i<=2;i++) ebullets.push({x:boss.x+boss.w/2,y:boss.y+boss.h-4,vx:i*2,vy:-1,grav:0.06,dmg:18,life:120,c:'#c43d2e'}); }

function updateCamp(){
  campT++; if(campMsgTime>0)campMsgTime--;
  if(player.fireCD>0)player.fireCD--; if(player.meleeCD>0)player.meleeCD--;
  if(player.meleeAnim>0)player.meleeAnim--; if(player.inv>0)player.inv--;
  if(player.dashCD>0)player.dashCD--;
  if(keys.dash && player.dashCD<=0){
    const isUp=keys.jump;
    const hdir=keys.left?-1:keys.right?1:0;
    const effectiveH=hdir!==0?hdir:(isUp?0:player.face);
    if(!isUp||hdir!==0) player.face=effectiveH||player.face;
    player.dashCD=player.dashCDMax; player.dashTimer=isUp?10:12;
    player.dashVx=effectiveH*(isUp?7:12); player.dashVy=isUp?-11:0;
    player.vx=player.dashVx; player.vy=player.dashVy;
    if(isUp) player.onGround=false;
    player.inv=Math.max(player.inv,20); player.dashHits=new Set();
    sfx('G5','32n');
    for(let i=0;i<10;i++) particles.push({x:player.x+player.w/2+(Math.random()-.5)*8,y:player.y+(isUp?player.h:22)+Math.random()*12,
      vx:-effectiveH*4+(Math.random()-.5)*2,vy:isUp?2+Math.random()*2:(Math.random()-.5)*2.5,life:13,c:isUp?'#ffd24a':i%2?'#5ad6ff':'#fff'});
  }
  if(player.dashTimer>0){
    player.dashTimer--;
    player.vx=player.dashVx;
    if(player.dashVy<0) player.vy=player.dashVy;
    if(player.dashTimer%2===0) for(let i=0;i<2;i++) particles.push({
      x:player.dashVy<0?player.x+player.w/2+(Math.random()-.5)*6:player.face>0?player.x:player.x+player.w,
      y:player.dashVy<0?player.y+player.h+Math.random()*4:player.y+14+Math.random()*20,
      vx:-player.dashVx*0.15,vy:player.dashVy<0?2:-0.5,life:8,c:player.dashVy<0?'#ffd24a':'#5ad6ff'});
  }
  const accel=0.62,maxv=2.7;
  if(player.dashTimer<=0){
    if(keys.left){player.vx-=accel;player.face=-1;}
    if(keys.right){player.vx+=accel;player.face=1;}
    if(!keys.left&&!keys.right)player.vx*=0.7;
    player.vx=Math.max(-maxv,Math.min(maxv,player.vx));
  }
  if(Math.abs(player.vx)>0.3&&player.onGround)player.walk+=0.3; else player.walk*=0.6;
  if(keys.jump&&player.onGround&&player.dashTimer<=0){player.vy=-7.4;player.onGround=false;sfx('C5','32n');}
  player.vy+=0.42; if(player.vy>9)player.vy=9;
  player.x+=player.vx; player.y+=player.vy;
  player.x=Math.max(4,player.x);
  player.onGround=false;
  if(player.y+player.h>=GROUND){player.y=GROUND-player.h;player.vy=0;player.onGround=true;}
  // 購買
  if(keys.fire&&player.fireCD<=0){
    player.fireCD=22;
    for(const s of CAMP_SHOPS){
      if(Math.abs(player.x+player.w/2-s.x)<48){
        if(score>=s.cost){score-=s.cost;s.apply(player);campShopMsg=s.name+'！  -'+s.cost+'分';campMsgTime=110;}
        else{campShopMsg='分數不足！需要 '+s.cost+'分';campMsgTime=75;sfx('A2','16n');}
        return;
      }
    }
  }
  // 出口：走進大門即前往下一關
  if(player.x+player.w>=CAMP_EXIT_X+4){
    sfx('C5','8n');
    level++;
    if(level>=5){recordScore(true);titleT=0;victoryParts=[];state='VICTORY';stopMusic();return;}
    state='PLAY';musicMode='none';buildLevel();
    return;
  }
  // 空戰更新
  campAirFight.forEach(f=>{
    f.x+=f.vx;f.t+=0.05;
    if(f.x<-50)f.x=VW+15; if(f.x>VW+50)f.x=-15;
    if(f.explode>0){f.explode--;if(f.explode===0){for(let k=0;k<10;k++)particles.push({x:f.x,y:f.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:22,c:f.human?'#ffd24a':'#9f4'});}}
    if(Math.random()<0.003)f.explode=10;
  });
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life--;});
  particles=particles.filter(p=>p.life>0);
}

function drawMarine(){

  X.fillStyle=blueD; X.fillRect(packX+(f>0?1:3),sy+11,6,12); X.fillStyle=blueDD; X.fillRect(packX+(f>0?1:3),sy+17,6,2);
  // ---- legs (run / jump / idle) ----
  const running=Math.abs(p.vx)>0.3&&p.onGround;
  const ph=Math.sin(p.walk*2), ph2=Math.sin(p.walk*2+Math.PI);
  let fX,bX,fLift,bLift;
  if(!p.onGround){ fX=f*4; bX=-f*3; fLift=5; bLift=2; }
  else if(running){ fX=ph*5*f; bX=ph2*5*f; fLift=ph>0?ph*5:0; bLift=ph2>0?ph2*5:0; }
  else { fX=0; bX=0; fLift=0; bLift=0; }
  function leg(lx,lift,backLeg){

  }
  leg(sx+5+bX, bLift, true);   // back
  leg(sx+14+fX, fLift, false); // front

  if(p.shield>0){ X.strokeStyle='rgba(120,200,255,'+(0.3+0.3*Math.sin(Date.now()/100))+')'; X.lineWidth=2; X.beginPath(); X.arc(cx,sy+22,25,0,6.28); X.stroke(); }
  if(p.blessing>0){ X.strokeStyle='rgba(255,215,80,'+(0.4+0.4*Math.sin(Date.now()/60))+')'; X.lineWidth=2; X.beginPath(); X.arc(cx,sy+22,29,0,6.28); X.stroke(); }
  if(p.rw===4&&p.chargeTimer>0){

    X.lineWidth=1.5+cprog*2.5; X.beginPath(); X.arc(cx,sy+22,24+cprog*7,0,6.28); X.stroke();

  if(p.dashTimer>0){

    const anim=0.4+0.35*Math.abs(Math.sin(Date.now()/110));

    X.beginPath(); X.arc(cx,sy+22,26,0,6.28); X.stroke();

    X.fillStyle='#9fe8ff'; X.fillRect(-3,-3,6,46); X.fillStyle='#fff'; X.fillRect(-2,-3,4,22);

    X.beginPath(); X.moveTo(0,-3); X.lineTo(0,46); X.stroke();
    X.globalAlpha=1; X.restore();
  }
  if(state==='EXTRACT'&&extractPhase>=2) X.globalAlpha=1;
}

function drawBoss(){
  if(!boss)return; const b=boss; const tele=b.tele>0&&Math.floor(b.tele/3)%2===0; const flash=b.hitFlash>0||tele; const c=flash?'#fff':b.col, bx=b.x-camX, by=b.y;
  // teleport fade (stalker)
  if(b.level===3&&b.tele>0){ X.globalAlpha=0.3; }
  X.fillStyle=c; X.fillRect(bx+10,by+14,b.w-20,b.h-20);
  X.fillStyle=flash?'#fff':shade(b.col,1.3); X.fillRect(bx+10,by+14,b.w-20,6);
  X.fillStyle=c; X.fillRect(bx+20,by,b.w-40,18);
  X.fillStyle='#1a0008'; X.fillRect(bx+24,by+7,b.w-48,7);
  X.fillStyle='#eee'; for(let i=0;i<7;i++)X.fillRect(bx+24+i*5,by+7,2,4);
  X.fillStyle='#ff3'; X.fillRect(bx+22,by+2,5,5); X.fillRect(bx+b.w-27,by+2,5,5);
  X.fillStyle=shade(b.col,0.7);
  if(b.level===0){ for(let i=0;i<5;i++){ X.beginPath(); X.arc(bx+14+i*13,by+b.h-6,6,0,6.28); X.fill(); } }
  else if(b.level===1){ X.fillRect(bx-10,by+22,15,10); X.fillRect(bx+b.w-5,by+22,15,10); X.fillStyle='#ddd'; X.fillRect(bx-13,by+20,5,5); X.fillRect(bx+b.w+8,by+20,5,5); }
  else if(b.level===2){ X.fillStyle='#7d4'; for(let i=0;i<6;i++)X.fillRect(bx+10+i*11,by+b.h-4,5,7); }
  else if(b.level===3){ X.fillRect(bx-12,by+12,18,5); X.fillRect(bx+b.w-6,by+12,18,5); }
  else if(b.level===4){ X.fillStyle='#fdd'; for(let i=0;i<8;i++)X.fillRect(bx+12+i*7,by-9,3,11); X.fillStyle=shade(b.col,0.7); X.fillRect(bx-12,by+24,18,8); X.fillRect(bx+b.w-6,by+24,18,8); }
  else if(b.level===6){ // 巢翼暴君：展翅動畫 + 冠刺 + 爪
    const wf=Math.sin(b.t*4)*18;
    const wc=flash?'#fff':shade(b.col,0.65);
    // 左翼兩段
    X.fillStyle=wc;
    X.beginPath(); X.moveTo(bx+8,by+18); X.lineTo(bx-38,by+wf-22); X.lineTo(bx-20,by+wf+2); X.lineTo(bx+8,by+36); X.closePath(); X.fill();
    X.beginPath(); X.moveTo(bx+8,by+34); X.lineTo(bx-26,by+wf+8); X.lineTo(bx-10,by+wf+26); X.lineTo(bx+8,by+54); X.closePath(); X.fill();
    // 右翼兩段
    X.beginPath(); X.moveTo(bx+b.w-8,by+18); X.lineTo(bx+b.w+38,by+wf-22); X.lineTo(bx+b.w+20,by+wf+2); X.lineTo(bx+b.w-8,by+36); X.closePath(); X.fill();
    X.beginPath(); X.moveTo(bx+b.w-8,by+34); X.lineTo(bx+b.w+26,by+wf+8); X.lineTo(bx+b.w+10,by+wf+26); X.lineTo(bx+b.w-8,by+54); X.closePath(); X.fill();
    // 翼膜紋路
    X.strokeStyle=shade(b.col,1.15); X.lineWidth=1;
    X.beginPath(); X.moveTo(bx+8,by+18); X.lineTo(bx-38,by+wf-22); X.stroke();
    X.beginPath(); X.moveTo(bx+b.w-8,by+18); X.lineTo(bx+b.w+38,by+wf-22); X.stroke();
    X.lineWidth=1;
    // 頂冠刺5根
    X.fillStyle=flash?'#fff':shade(b.col,0.8);
    for(let i=0;i<5;i++) X.fillRect(bx+14+i*11,by-12,4,14);

}

//------------------------ EXTRACT SEQUENCE -------------------------
function updateExtract(){
  extractTimer++; if(msgTime>0)msgTime--; if(cmdMsgTime>0)cmdMsgTime--;
  if(player.inv>0)player.inv--;
  if(ally&&ally.alive&&ally.inv>0)ally.inv--;
  allies.forEach(al=>{ if(al.alive&&al.inv>0)al.inv--; });
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;}); particles=particles.filter(p=>p.life>0);

  if(extractPhase===0){
    // 玩家正常移動（簡化版）
    if(player.fireCD>0)player.fireCD--; if(player.dashCD>0)player.dashCD--;
    const accel=0.62,maxv=2.7;
    if(keys.left){player.vx-=accel;player.face=-1;}
    if(keys.right){player.vx+=accel;player.face=1;}
    if(!keys.left&&!keys.right)player.vx*=0.7;
    player.vx=Math.max(-maxv,Math.min(maxv,player.vx));
    if(Math.abs(player.vx)>0.3&&player.onGround)player.walk+=0.3; else player.walk*=0.6;
    if(keys.jump&&player.onGround){player.vy=-7.4;player.onGround=false;sfx('C5','32n');}
    player.vy+=0.42; if(player.vy>9)player.vy=9;
    player.x+=player.vx; player.y+=player.vy;
    if(player.x<camX+2)player.x=camX+2;
    player.onGround=false;
    if(player.y+player.h>=GROUND){player.y=GROUND-player.h;player.vy=0;player.onGround=true;}
    platforms.forEach(p=>{if(player.x+player.w>p.x+3&&player.x<p.x+p.w-3){const pb=player.y+player.h-player.vy;if(pb<=p.y+6&&player.y+player.h>=p.y&&player.y+player.h<=p.y+20){player.y=p.y-player.h;player.vy=0;player.onGround=true;}}});
    const camMax=Math.max(LV_LEN[5]-VW, extractZoneX-200);
    const desiredCam=Math.min(camMax, player.x-VW*0.35);
    if(desiredCam>camX)camX+=(desiredCam-camX)*0.12;
    // 盟友跟隨（singular ally）
    if(ally&&ally.alive){
      const adx=player.x-ally.x; ally.vx=Math.abs(adx)>40?Math.min(2.5,(ally.vx||0)+Math.sign(adx)*0.35):(ally.vx||0)*0.7;
      ally.vy+=0.42;if(ally.vy>9)ally.vy=9; ally.y+=ally.vy; ally.x+=ally.vx||0;
      ally.onGround=false; if(ally.y+44>=GROUND){ally.y=GROUND-44;ally.vy=0;ally.onGround=true;}
      ally.face=Math.sign(adx)||1; if(Math.abs(ally.vx||0)>0.3)ally.walk=(ally.walk||0)+0.3; else ally.walk=(ally.walk||0)*0.6;
    }
    // allies[]跟隨（前線救援盟友組）
    allies.forEach(al=>{
      if(!al.alive)return;
      const adx=player.x-al.x; al.vx=Math.abs(adx)>50?Math.min(2.5,(al.vx||0)+Math.sign(adx)*0.32):(al.vx||0)*0.7;
      al.vy+=0.42;if(al.vy>9)al.vy=9; al.y+=al.vy; al.x+=al.vx||0;
      al.onGround=false; if(al.y+44>=GROUND){al.y=GROUND-44;al.vy=0;al.onGround=true;}
      al.face=Math.sign(adx)||1; if(Math.abs(al.vx||0)>0.3)al.walk=(al.walk||0)+0.3; else al.walk=(al.walk||0)*0.6;
    });
    // 進入撤離區
    if(player.x+player.w/2>extractZoneX-50&&player.onGround){
      extractPhase=1; extractTimer=0;
      shipSX=camX+VW+160; shipSY=-90; // 從右上角飛入
      player.vx=0; player.face=1;
      if(ally&&ally.alive){ally.vx=0;ally.face=1;}
      allies.forEach(al=>{ if(al.alive){al.vx=0;al.face=1;} });
      flashMsg('飛船到來！準備撤離！'); sfx('E5','4n');
    }
  } else if(extractPhase===1){
    // 飛船降臨（120幀）
    const prog=Math.min(1,extractTimer/120);
    const ease=prog<0.5?2*prog*prog:1-Math.pow(-2*prog+2,2)/2;
    const tgX=extractZoneX, tgY=GROUND-145;
    shipSX=camX+VW+160+(tgX-(camX+VW+160))*ease;
    shipSY=-90+(tgY+90)*ease;
    if(extractTimer===80){sfx('G4','4n');}
    if(extractTimer>=120){extractPhase=2;extractTimer=0;sfx('C5','4n');}
  } else if(extractPhase===2){
    // 吊升玩家與盟友（90幀）
    const prog=Math.min(1,extractTimer/90);
    extractPlayerOY=-prog*110;
    if(ally&&ally.alive)extractAllyOY=-prog*110;
    alliesOY=alliesOY.map(()=>-prog*110);
    if(extractTimer>=90){extractPhase=3;extractTimer=0;sfx('G5','4n');}
  } else if(extractPhase===3){
    // 飛船飛離（90幀）
    const prog=Math.min(1,extractTimer/90);
    const ease=prog*prog;
    const baseX=extractZoneX, baseY=GROUND-145;
    shipSX=baseX+ease*(VW+200); shipSY=baseY-ease*220;
    extractPlayerOY=-110-ease*110; if(ally&&ally.alive)extractAllyOY=-110-ease*110;
    alliesOY=alliesOY.map(()=>-110-ease*110);
    if(extractTimer>=90){
      recordScore(true); titleT=0; victoryWaitingNext=false; victoryParts=[];
      state='VICTORY'; stopMusic();
    }
  }
}

  X.strokeStyle='rgba(255,210,40,'+pulse+')'; X.lineWidth=2;

function updateAlly(){
  if(!ally) return;

  if(!ally.alive){
    if(ally.respawnTimer>0){ ally.respawnTimer--; if(ally.respawnTimer<=0) respawnAlly(); }
    return;
  }
  if(ally.hp<=0){ ally.alive=false; ally.respawnTimer=600; flashMsg('盟友陣亡！10秒後復活'); sfx('A2','8n'); return; }
  ally.t+=0.06; if(ally.inv>0)ally.inv--; if(ally.fireCD>0)ally.fireCD--;
  if(ally.meleeCD>0)ally.meleeCD--; if(ally.meleeAnim>0)ally.meleeAnim--;
  ally.vy+=0.42; if(ally.vy>9)ally.vy=9; ally.y+=ally.vy; ally.x+=ally.vx||0; ally.vx=(ally.vx||0)*0.72;
  ally.onGround=false;
  if(ally.y+44>=GROUND){ally.y=GROUND-44;ally.vy=0;ally.onGround=true;}
  platforms.forEach(p=>{if(ally.x+26>p.x+3&&ally.x<p.x+p.w-3){const pb=ally.y+44-(ally.vy||0);if(pb<=p.y+6&&ally.y+44>=p.y&&ally.y+44<=p.y+20){ally.y=p.y-44;ally.vy=0;ally.onGround=true;}}});

  let nearest=null,nearDist=9999;
  enemies.forEach(e=>{if(!e.dead){const d=Math.abs(e.x-ally.x);if(d<nearDist){nearDist=d;nearest=e;}}});
  const targetX=boss&&!bossIntro?boss.x:nearest?nearest.x:player.x+80;

    if(ally.fireCD<=0&&(nearDist<170||(boss&&!bossIntro))){ally.fireCD=20;

  if(boss&&!bossIntro&&aabb({x:ally.x,y:ally.y,w:26,h:44},boss)&&ally.inv<=0){ally.hp-=1.2;ally.inv=40;}

function drawCamp(){
  drawCampBackground();

    X.fillStyle=near?'#30343c':'#24272e'; X.fillRect(sx,sy,sw,sh);

  // 出口大門
  {

    X.fillStyle='#ffd24a'; X.font='bold 8px "Courier New"'; X.textAlign='center';
    X.fillText('掉落物上下漂浮，走過去自動撿取，★帝皇恩賜 最為珍貴！',CT,247);
  }
  else if(tutPage===4){
    // ── 遠程武器 ──
    X.fillStyle='#ffa0a0'; X.font='bold 9px "Courier New"'; X.textAlign='center'; X.fillText('遠程武器 RANGED WEAPONS',CT,34);
    X.fillStyle='#556'; X.font='7px "Courier New"'; X.fillText('升級：撿武器晶片▣ / 能量滿100 / 補給站武器庫  最高 Lv5',CT,43);
    const rw=[
      {rw:0,col:'#ffd24a',n:'爆彈槍 BOLTER',         tip:'均衡主力，高Lv→多顆彈同時射出'},
      {rw:1,col:'#ff7a1a',n:'火焰槍 FLAMER',         tip:'近程散射，高Lv→散射數增加'},
      {rw:2,col:'#5ad6ff',n:'電磁砲 RAILGUN',        tip:'高傷穿透，貫穿所有敵人'},
      {rw:3,col:'#a8e063',n:'槍榴彈 GRENADE',        tip:'拋射落地爆炸，範圍傷害'},
      {rw:4,col:'#a0e4ff',n:'充能步槍 CHARGE RIFLE', tip:'長按集氣→衝擊波穿透全場 傷300'},
    ];
    rw.forEach((w,i)=>{
      const gy=52+i*37;
      X.fillStyle='rgba(255,255,255,0.04)'; X.fillRect(L,gy-4,VW-52,32);
      X.strokeStyle='rgba(100,100,120,0.28)'; X.lineWidth=0.5; X.strokeRect(L+.5,gy-3.5,VW-53,31);
      drawGun(L+46,gy+10,1,w.rw);
      X.fillStyle=w.col; X.font='bold 8px "Courier New"'; X.textAlign='left'; X.fillText(w.n,L+74,gy+5);
      X.fillStyle='#778'; X.font='7px "Courier New"'; X.fillText(w.tip,L+74,gy+17);
      X.fillStyle='#444'; X.font='6px "Courier New"'; X.textAlign='right'; X.fillText('Lv1~5',VW-28,gy+5);
    });
  }
  else if(tutPage===5){
    // ── 近戰武器 ──
    X.fillStyle='#9fe8ff'; X.font='bold 9px "Courier New"'; X.textAlign='center'; X.fillText('近戰武器 MELEE WEAPONS',CT,34);
    X.fillStyle='#556'; X.font='7px "Courier New"'; X.fillText('升級：同遠程武器，最高 Lv5，等級越高傷害倍率越高',CT,43);
    const mw=[
      {mw:0,col:'#9fe8ff',n:'動力劍 POWER SWORD',   stats:'傷30  攻速快  觸及42px',tip:'輕快連擊型，機動性佳，適合對付大量普通敵人'},
      {mw:1,col:'#ffcf5a',n:'動力錘 THUNDER HAMMER', stats:'傷55  攻速慢  大擊退', tip:'重擊型，一擊打飛並打斷敵人動作，Boss 剋星'},
      {mw:2,col:'#ff8a4a',n:'動力拳 POWER FIST',    stats:'傷42  攻速最快 觸及32px',tip:'均衡型，速度與傷害兼具，適合近身纏鬥'},
    ];
    mw.forEach((w,i)=>{
      const gy=52+i*57;
      X.fillStyle='rgba(255,255,255,0.04)'; X.fillRect(L,gy-4,VW-52,51);
      X.strokeStyle=w.col; X.lineWidth=0.5; X.globalAlpha=0.38; X.strokeRect(L+.5,gy-3.5,VW-53,50); X.globalAlpha=1;
      X.save(); X.translate(L+8,gy+18); X.rotate(-0.15);
      if(w.mw===0){X.fillStyle=w.col;X.fillRect(0,-3,42,6);X.fillStyle='#fff';X.fillRect(0,-2,42,2);}
      else if(w.mw===1){X.fillStyle='#888';X.fillRect(0,-3,36,6);X.fillStyle=w.col;X.fillRect(0,-2,34,4);X.fillStyle='#888';X.fillRect(24,-11,14,22);X.fillStyle=w.col;X.fillRect(25,-10,12,20);}
      else{X.fillStyle=w.col;X.fillRect(0,-3,32,6);X.fillRect(22,-9,14,18);X.fillStyle='#fff';X.fillRect(24,-7,10,4);}
      X.restore();
      X.fillStyle=w.col; X.font='bold 8px "Courier New"'; X.textAlign='left'; X.fillText(w.n,L+60,gy+5);
      X.fillStyle='#aaa'; X.font='7px "Courier New"'; X.fillText(w.stats,L+60,gy+16);
      X.fillStyle='#778'; X.font='7px "Courier New"'; X.fillText(w.tip,L+60,gy+27);
      pxs(L+60,gy+33,50,3,'#222'); pxs(L+60,gy+33,10,3,w.col);
      X.fillStyle='#444'; X.font='6px "Courier New"'; X.textAlign='right'; X.fillText('Lv1~5',L+60+52,gy+37);
    });
    X.fillStyle='rgba(20,30,60,0.5)'; X.fillRect(L,224,VW-52,20);
    X.strokeStyle='rgba(90,160,255,0.3)'; X.lineWidth=1; X.strokeRect(L+.5,224.5,VW-53,19);
    X.fillStyle='#ffd24a'; X.font='bold 8px "Courier New"'; X.textAlign='center';
    X.fillText('衝刺 120傷  ·  血天使近戰+50%  ·  天罰俯衝250傷',CT,233);
    X.fillStyle='#9ab'; X.font='7px "Courier New"';
    X.fillText('近戰可擊退敵人，中斷敵人攻擊動作，Boss 戰多用近戰可穩定輸出',CT,243);
  }
  X.textAlign='left';
}
//------------------------ LOOP ------------------------------
function drawPauseOverlay(){
  X.fillStyle='rgba(0,0,0,0.72)'; X.fillRect(0,0,VW,VH); X.textAlign='center';
  if(!quitConfirm){
    // ── 一般暫停畫面 ──
    X.fillStyle='#ffd24a'; X.font='bold 24px "Courier New"'; X.fillText('暫 停',VW/2,VH/2-16);
    X.fillStyle='#fff'; X.font='11px "Courier New"'; X.fillText('PAUSED',VW/2,VH/2+2);
    X.fillStyle='#9ab'; X.font='9px "Courier New"'; X.fillText(isMobile?'點擊 ▶ 繼續':'按 P 或 ESC 繼續',VW/2,VH/2+18);
    // 離開按鈕
    X.fillStyle='rgba(160,30,30,0.45)'; X.fillRect(VW/2-62,VH/2+30,124,22);
    X.strokeStyle='rgba(220,70,70,0.65)'; X.lineWidth=1; X.strokeRect(VW/2-62,VH/2+30,124,22);
    X.fillStyle='#f88'; X.font='9px "Courier New"';
    X.fillText(isMobile?'[ 離開 — 不計入排行榜 ]':'[ Q ] 離開  — 不計入排行榜',VW/2,VH/2+45);
  } else {
    // ── 雙重確認對話框 ──
    X.fillStyle='rgba(20,10,10,0.92)'; X.fillRect(VW/2-100,VH/2-46,200,100);
    X.strokeStyle='rgba(220,70,70,0.8)'; X.lineWidth=1.5; X.strokeRect(VW/2-100,VH/2-46,200,100);
    X.fillStyle='#ffa0a0'; X.font='bold 12px "Courier New"'; X.fillText('確定要離開？',VW/2,VH/2-24);
    X.fillStyle='#888'; X.font='8px "Courier New"'; X.fillText('此局分數不計入排行榜',VW/2,VH/2-8);
    // 確認按鈕（左）
    X.fillStyle='rgba(180,30,30,0.6)'; X.fillRect(VW/2-96,VH/2+4,88,28);
    X.strokeStyle='rgba(255,80,80,0.7)'; X.lineWidth=1; X.strokeRect(VW/2-96,VH/2+4,88,28);
    X.fillStyle='#f88'; X.font='bold 9px "Courier New"'; X.fillText('確認離開',VW/2-52,VH/2+22);
    // 取消按鈕（右）
    X.fillStyle='rgba(30,80,30,0.6)'; X.fillRect(VW/2+8,VH/2+4,88,28);
    X.strokeStyle='rgba(80,200,80,0.7)'; X.lineWidth=1; X.strokeRect(VW/2+8,VH/2+4,88,28);
    X.fillStyle='#8f8'; X.font='bold 9px "Courier New"'; X.fillText('繼續遊戲',VW/2+52,VH/2+22);
    // 鍵盤提示
    X.fillStyle='#556'; X.font='7px "Courier New"'; X.fillText(isMobile?'點選按鈕確認':'Q=確認離開  P/ESC=取消',VW/2,VH/2+44);
  }
  X.textAlign='left';
}
function loop(){
  update(); X.setTransform(SCALE,0,0,SCALE,0,0); X.clearRect(0,0,VW,VH);
  const playing=(state==='PLAY'||state==='TRANS'||state==='CAMP'||state==='EXTRACT');
  pauseBtn.style.display=playing?'block':'none';
  if(isMobile)document.getElementById('touch').style.display=(state==='PLAY'||state==='TRANS'||state==='CAMP'||(state==='EXTRACT'&&extractPhase===0))?'block':'none';
  if(audioReady && (state==='TITLE'||state==='SELECT'||state==='TUTORIAL'||state==='CAMP'||state==='LEADERBOARD'||state==='TERMINAL') && musicMode!=='menu') setMusic('menu');
  if(state==='TITLE'){ drawTitle(); }
  else if(state==='SELECT'){ drawSelect(); }
  else if(state==='TERMINAL'){ drawTerminal(); }
  else if(state==='TUTORIAL'){ drawTutorial(); }
  else if(state==='LEADERBOARD'){ drawLeaderboardScreen(); }
  else if(state==='CAMP'){ drawCamp(); if(paused)drawPauseOverlay(); }
  else if(state==='EXTRACT'){ drawBackground(); drawPlatforms(); drawParticles(); drawShockwaves(); drawExtractionZone(); drawShip(); drawAlly(); drawAlliesGroup(); drawDashTrail(); drawMarine(); drawExtractHUD(); if(paused)drawPauseOverlay(); }
  else { drawBackground(); drawPlatforms(); drawPools(); drawDrops(); enemies.forEach(drawEnemy); drawBoss(); drawBullets(); if(isSpecialLevel)drawTower(); if(isSpecialLevel)drawAlly(); if(isTerminalMission&&allies.length>0)drawAlliesGroup(); drawDashTrail(); drawMarine(); drawParticles(); drawShockwaves(); drawHUD();
    if(paused&&playing)drawPauseOverlay();
    if(state==='GAMEOVER')drawGameOver(); if(state==='VICTORY')drawVictory(); }
  requestAnimationFrame(loop);
}
loop();
</script>
